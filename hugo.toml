baseURL = "https://cilv2.com/"
languageCode = "es-MX"
defaultContentLanguage = "es"
title = "Condominio Ignacio L. Vallarta II"
disableHugoGeneratorInject = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  # Paso unico de lanzamiento: cambiar a true cuando el abogado haya revisado el sitio.
  # Mientras sea false: noindex en todas las paginas, robots.txt con Disallow y sitemap vacio.
  launched = false

[markup.goldmark.parser]
  autoHeadingIDs = true
  [markup.goldmark.parser.attribute]
    title = true
    block = true

